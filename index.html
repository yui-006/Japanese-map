<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>にほんちずゲーム</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: linear-gradient(160deg, #c8e6ff 0%, #d4f5c8 100%);
  font-family: 'Rounded Mplus 1c', 'Hiragino Maru Gothic Pro', 'BIZ UDPGothic', Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10px 6px;
  user-select: none;
}

.title {
  font-size: 2em;
  font-weight: bold;
  color: #1a4a8a;
  text-shadow: 2px 2px 0 rgba(255,255,255,0.6);
  margin: 8px 0;
  letter-spacing: 2px;
}

/* ===== ちほうえらびがめん ===== */
#screen-select { width: 100%; max-width: 660px; text-align: center; }

.select-lead { font-size: 1.25em; color: #444; margin-bottom: 16px; font-weight: bold; }

.region-grid { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; padding: 0 8px; }

.rbtn {
  padding: 14px 18px; font-size: 1.1em; font-weight: bold;
  border: none; border-radius: 18px; cursor: pointer;
  color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.35);
  box-shadow: 0 4px 0 rgba(0,0,0,0.2);
  transition: transform .1s, box-shadow .1s;
  min-width: 150px; line-height: 1.4;
}
.rbtn:hover  { transform: translateY(-2px); box-shadow: 0 6px 0 rgba(0,0,0,0.2); }
.rbtn:active { transform: translateY(2px);  box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
.rbtn small  { display: block; font-size: 0.72em; opacity: 0.85; }

/* ===== ゲームがめん ===== */
#screen-game { width: 100%; max-width: 700px; display: none; flex-direction: column; align-items: center; }

.top-bar {
  display: flex; align-items: center; gap: 10px;
  flex-wrap: wrap; justify-content: center;
  margin-bottom: 8px; width: 100%;
}

.question-box {
  background: white; border-radius: 20px; padding: 10px 26px;
  text-align: center; box-shadow: 0 3px 12px rgba(0,0,0,0.15); min-width: 190px;
}
.q-lead  { font-size: 0.95em; color: #888; }
.q-ruby  { font-size: 1.4em; color: #3366bb; letter-spacing: 4px; line-height: 1.1; }
.q-kanji { font-size: 2.4em; font-weight: bold; color: #111; line-height: 1.15; }

.score-box {
  background: white; border-radius: 16px; padding: 8px 16px;
  font-size: 1.15em; box-shadow: 0 3px 10px rgba(0,0,0,0.1); white-space: nowrap;
}

.back-btn {
  padding: 10px 18px; border-radius: 12px; border: none;
  background: #8899aa; color: white; font-size: 0.95em; cursor: pointer;
  box-shadow: 0 3px 0 rgba(0,0,0,0.2);
}
.back-btn:active { transform: translateY(2px); box-shadow: none; }

.map-wrap { width: 100%; position: relative; }

svg#jmap { width: 100%; height: auto; display: block; border-radius: 14px;
  filter: drop-shadow(0 2px 8px rgba(0,0,0,0.15)); }

.pref { cursor: pointer; }
.pref:hover { opacity: 0.82; }
.pref.dim { cursor: default !important; }

@keyframes flash-ok {
  0%,100% { fill: #4caf50; }
  50%      { fill: #a5d6a7; }
}
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25%     { transform: translateX(-6px); }
  75%     { transform: translateX(6px); }
}
.pref.correct { animation: flash-ok .55s ease-out; }
.pref.wrong   { animation: shake .4s ease-out; }

/* ローディング */
#loading {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.45); z-index: 500;
  align-items: center; justify-content: center; flex-direction: column; gap: 18px;
}
.loading-box {
  background: white; border-radius: 20px; padding: 32px 44px; text-align: center;
}
.spinner {
  width: 48px; height: 48px; border: 5px solid #ddd;
  border-top-color: #3498db; border-radius: 50%;
  animation: spin .8s linear infinite; margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* 終了ポップアップ */
#popup-end {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.45); z-index: 300;
  align-items: center; justify-content: center;
}
.end-box {
  background: white; border-radius: 24px; padding: 36px 48px; text-align: center;
  box-shadow: 0 8px 32px rgba(0,0,0,.3);
}
.end-title { font-size: 2.2em; font-weight: bold; color: #1a4a8a; }
.end-score { font-size: 1.5em; margin: 14px 0 22px; }
.end-btns  { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.end-btn {
  padding: 12px 28px; border: none; border-radius: 14px;
  font-size: 1.1em; font-weight: bold; cursor: pointer;
  box-shadow: 0 3px 0 rgba(0,0,0,.2);
}
.end-btn:active { transform: translateY(2px); box-shadow: none; }

/* 進捗バー */
.progress-bar-wrap {
  width: 100%; height: 10px; background: rgba(255,255,255,.5);
  border-radius: 8px; margin-bottom: 6px; overflow: hidden;
}
.progress-bar-fill {
  height: 100%; background: linear-gradient(90deg, #42a5f5, #66bb6a);
  border-radius: 8px; transition: width .4s;
}

/* 紙吹雪 */
.confetti-piece {
  position: fixed; width: 10px; height: 14px; border-radius: 2px;
  top: -20px; animation: confetti-fall linear forwards;
  z-index: 400; pointer-events: none;
}
@keyframes confetti-fall {
  to { top: 110vh; transform: rotate(720deg) translateX(60px); opacity: 0; }
}
</style>
</head>
<body>

<div class="title">🗾 にほんちずゲーム</div>

<!-- ===== えらびがめん ===== -->
<div id="screen-select">
  <p class="select-lead">どのちほうで あそぶ？</p>
  <div class="region-grid">
    <button class="rbtn" style="background:#e74c3c;" onclick="startGame('all')">
      ぜんこく<small>47 とどうふけん</small>
    </button>
    <button class="rbtn" style="background:#3498db;" onclick="startGame('hokkaido')">
      ほっかいどう<small>北海道 1</small>
    </button>
    <button class="rbtn" style="background:#27ae60;" onclick="startGame('tohoku')">
      とうほく<small>東北 6けん</small>
    </button>
    <button class="rbtn" style="background:#e67e22;" onclick="startGame('kanto')">
      かんとう<small>関東 7とけん</small>
    </button>
    <button class="rbtn" style="background:#f39c12;" onclick="startGame('chubu')">
      ちゅうぶ<small>中部 9けん</small>
    </button>
    <button class="rbtn" style="background:#e91e63;" onclick="startGame('kinki')">
      きんき<small>近畿 7ふけん</small>
    </button>
    <button class="rbtn" style="background:#9b59b6;" onclick="startGame('chugoku')">
      ちゅうごく<small>中国 5けん</small>
    </button>
    <button class="rbtn" style="background:#16a085;" onclick="startGame('shikoku')">
      しこく<small>四国 4けん</small>
    </button>
    <button class="rbtn" style="background:#c0392b;" onclick="startGame('kyushu')">
      きゅうしゅう・おきなわ<small>九州・沖縄 8けん</small>
    </button>
  </div>
</div>

<!-- ===== ゲームがめん ===== -->
<div id="screen-game">
  <div class="top-bar">
    <div class="question-box">
      <div class="q-lead">この けんは どこ？</div>
      <div class="q-ruby"  id="q-ruby">　</div>
      <div class="q-kanji" id="q-kanji">　</div>
    </div>
    <div class="score-box">⭕ <span id="sc-ok">0</span>　❌ <span id="sc-ng">0</span></div>
    <button class="back-btn" onclick="goHome()">もどる</button>
  </div>
  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="prog-fill" style="width:0%"></div></div>
  <div class="map-wrap">
    <svg id="jmap" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
</div>

<!-- ローディング -->
<div id="loading">
  <div class="loading-box">
    <div class="spinner"></div>
    <div style="font-size:1.2em;">ちずを よみこみ中…</div>
  </div>
</div>

<!-- 終了ポップアップ -->
<div id="popup-end">
  <div class="end-box">
    <div style="font-size:3em;">🎊</div>
    <div class="end-title">ぜんぶ クリア！</div>
    <div class="end-score" id="end-score"></div>
    <div class="end-btns">
      <button class="end-btn" style="background:#3498db;color:white;" onclick="restartGame()">もういちど</button>
      <button class="end-btn" style="background:#aaa;color:white;" onclick="goHome()">もどる</button>
    </div>
  </div>
</div>

<script>
// ===== 都道府県データ（コード順） =====
const PREFS = [
  { code:'01', id:'hokkaido',  name:'北海道', r:'ほっかいどう', region:'hokkaido', c:'#3498db' },
  { code:'02', id:'aomori',    name:'青森',   r:'あおもり',    region:'tohoku',   c:'#27ae60' },
  { code:'03', id:'iwate',     name:'岩手',   r:'いわて',      region:'tohoku',   c:'#27ae60' },
  { code:'04', id:'miyagi',    name:'宮城',   r:'みやぎ',      region:'tohoku',   c:'#27ae60' },
  { code:'05', id:'akita',     name:'秋田',   r:'あきた',      region:'tohoku',   c:'#27ae60' },
  { code:'06', id:'yamagata',  name:'山形',   r:'やまがた',    region:'tohoku',   c:'#27ae60' },
  { code:'07', id:'fukushima', name:'福島',   r:'ふくしま',    region:'tohoku',   c:'#27ae60' },
  { code:'08', id:'ibaraki',   name:'茨城',   r:'いばらき',    region:'kanto',    c:'#e67e22' },
  { code:'09', id:'tochigi',   name:'栃木',   r:'とちぎ',      region:'kanto',    c:'#e67e22' },
  { code:'10', id:'gunma',     name:'群馬',   r:'ぐんま',      region:'kanto',    c:'#e67e22' },
  { code:'11', id:'saitama',   name:'埼玉',   r:'さいたま',    region:'kanto',    c:'#e67e22' },
  { code:'12', id:'chiba',     name:'千葉',   r:'ちば',        region:'kanto',    c:'#e67e22' },
  { code:'13', id:'tokyo',     name:'東京',   r:'とうきょう',  region:'kanto',    c:'#e67e22' },
  { code:'14', id:'kanagawa',  name:'神奈川', r:'かながわ',    region:'kanto',    c:'#e67e22' },
  { code:'15', id:'niigata',   name:'新潟',   r:'にいがた',    region:'chubu',    c:'#f39c12' },
  { code:'16', id:'toyama',    name:'富山',   r:'とやま',      region:'chubu',    c:'#f39c12' },
  { code:'17', id:'ishikawa',  name:'石川',   r:'いしかわ',    region:'chubu',    c:'#f39c12' },
  { code:'18', id:'fukui',     name:'福井',   r:'ふくい',      region:'chubu',    c:'#f39c12' },
  { code:'19', id:'yamanashi', name:'山梨',   r:'やまなし',    region:'chubu',    c:'#f39c12' },
  { code:'20', id:'nagano',    name:'長野',   r:'ながの',      region:'chubu',    c:'#f39c12' },
  { code:'21', id:'gifu',      name:'岐阜',   r:'ぎふ',        region:'chubu',    c:'#f39c12' },
  { code:'22', id:'shizuoka',  name:'静岡',   r:'しずおか',    region:'chubu',    c:'#f39c12' },
  { code:'23', id:'aichi',     name:'愛知',   r:'あいち',      region:'chubu',    c:'#f39c12' },
  { code:'24', id:'mie',       name:'三重',   r:'みえ',        region:'kinki',    c:'#e91e63' },
  { code:'25', id:'shiga',     name:'滋賀',   r:'しが',        region:'kinki',    c:'#e91e63' },
  { code:'26', id:'kyoto',     name:'京都',   r:'きょうと',    region:'kinki',    c:'#e91e63' },
  { code:'27', id:'osaka',     name:'大阪',   r:'おおさか',    region:'kinki',    c:'#e91e63' },
  { code:'28', id:'hyogo',     name:'兵庫',   r:'ひょうご',    region:'kinki',    c:'#e91e63' },
  { code:'29', id:'nara',      name:'奈良',   r:'なら',        region:'kinki',    c:'#e91e63' },
  { code:'30', id:'wakayama',  name:'和歌山', r:'わかやま',    region:'kinki',    c:'#e91e63' },
  { code:'31', id:'tottori',   name:'鳥取',   r:'とっとり',    region:'chugoku',  c:'#9b59b6' },
  { code:'32', id:'shimane',   name:'島根',   r:'しまね',      region:'chugoku',  c:'#9b59b6' },
  { code:'33', id:'okayama',   name:'岡山',   r:'おかやま',    region:'chugoku',  c:'#9b59b6' },
  { code:'34', id:'hiroshima', name:'広島',   r:'ひろしま',    region:'chugoku',  c:'#9b59b6' },
  { code:'35', id:'yamaguchi', name:'山口',   r:'やまぐち',    region:'chugoku',  c:'#9b59b6' },
  { code:'36', id:'tokushima', name:'徳島',   r:'とくしま',    region:'shikoku',  c:'#16a085' },
  { code:'37', id:'kagawa',    name:'香川',   r:'かがわ',      region:'shikoku',  c:'#16a085' },
  { code:'38', id:'ehime',     name:'愛媛',   r:'えひめ',      region:'shikoku',  c:'#16a085' },
  { code:'39', id:'kochi',     name:'高知',   r:'こうち',      region:'shikoku',  c:'#16a085' },
  { code:'40', id:'fukuoka',   name:'福岡',   r:'ふくおか',    region:'kyushu',   c:'#c0392b' },
  { code:'41', id:'saga',      name:'佐賀',   r:'さが',        region:'kyushu',   c:'#c0392b' },
  { code:'42', id:'nagasaki',  name:'長崎',   r:'ながさき',    region:'kyushu',   c:'#c0392b' },
  { code:'43', id:'kumamoto',  name:'熊本',   r:'くまもと',    region:'kyushu',   c:'#c0392b' },
  { code:'44', id:'oita',      name:'大分',   r:'おおいた',    region:'kyushu',   c:'#c0392b' },
  { code:'45', id:'miyazaki',  name:'宮崎',   r:'みやざき',    region:'kyushu',   c:'#c0392b' },
  { code:'46', id:'kagoshima', name:'鹿児島', r:'かごしま',    region:'kyushu',   c:'#c0392b' },
  { code:'47', id:'okinawa',   name:'沖縄',   r:'おきなわ',    region:'kyushu',   c:'#c0392b' },
];

const REGION_IDS = {
  all:      PREFS.map(p => p.id),
  hokkaido: ['hokkaido'],
  tohoku:   PREFS.filter(p => p.region === 'tohoku').map(p => p.id),
  kanto:    PREFS.filter(p => p.region === 'kanto').map(p => p.id),
  chubu:    PREFS.filter(p => p.region === 'chubu').map(p => p.id),
  kinki:    PREFS.filter(p => p.region === 'kinki').map(p => p.id),
  chugoku:  PREFS.filter(p => p.region === 'chugoku').map(p => p.id),
  shikoku:  PREFS.filter(p => p.region === 'shikoku').map(p => p.id),
  kyushu:   PREFS.filter(p => p.region === 'kyushu').map(p => p.id),
};

// ===== ゲーム状態 =====
let state = { region: null, active: [], queue: [], current: null, ok: 0, ng: 0, total: 0 };

// ===== TopoJSON キャッシュ =====
let topoCache = null;
let featuresCache = null; // { code -> GeoJSON feature }
let pathGenCache = null;

// ===== ユーティリティ =====
function shuffle(a) {
  const b = [...a];
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.random() * i | 0;
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}
function prefById(id)  { return PREFS.find(p => p.id === id); }

// feature の id から都道府県コード（2桁文字列）を得る
function codeFromFeatureId(id) {
  const s = String(id ?? '');
  // "1" → "01", "47" → "47", "01000" → "01"
  return s.length <= 2 ? s.padStart(2, '0') : s.substring(0, 2).padStart(2, '0');
}

// ===== 地図の読み込み & 描画 =====
const MAP_W = 700, MAP_H = 750;

async function loadAndBuildMap() {
  const loading = document.getElementById('loading');

  // TopoJSON を一度だけ取得
  if (!topoCache) {
    loading.style.display = 'flex';
    try {
      topoCache = await d3.json('https://unpkg.com/jpn-atlas@1/japan/japan.json');
    } catch (e) {
      loading.style.display = 'none';
      alert('ちずデータの よみこみに しっぱいしました。\nインターネットに つながっているか かくにんしてください。');
      return false;
    }
    loading.style.display = 'none';
  }

  buildMap();
  return true;
}

function buildMap() {
  const topo = topoCache;
  const features = topojson.feature(topo, topo.objects.prefectures).features;

  // コード→feature のマップを作成（キャッシュ）
  featuresCache = {};
  features.forEach(f => {
    const code = codeFromFeatureId(f.id);
    featuresCache[code] = f;
  });

  // SVG セットアップ
  const svg = d3.select('#jmap');
  svg.attr('viewBox', `0 0 ${MAP_W} ${MAP_H}`);
  svg.selectAll('*').remove();

  // 海の背景
  svg.append('rect')
    .attr('width', MAP_W).attr('height', MAP_H)
    .attr('fill', '#a8d8ea').attr('rx', 14);

  // プロジェクション（全feature にfitExtent）
  const projection = d3.geoMercator()
    .fitExtent([[20, 20], [MAP_W - 20, MAP_H - 20]], {
      type: 'FeatureCollection', features
    });
  const pathGen = d3.geoPath().projection(projection);
  pathGenCache = pathGen;

  // 都道府県パスを描画
  PREFS.forEach(pref => {
    const feat = featuresCache[pref.code];
    if (!feat) return;

    const isActive = state.active.includes(pref.id);
    const fillColor = isActive ? pref.c : '#b8ccd8';

    svg.append('path')
      .datum(feat)
      .attr('d', pathGen)
      .attr('fill', fillColor)
      .attr('stroke', 'white')
      .attr('stroke-width', isActive ? 0.8 : 0.5)
      .attr('class', 'pref' + (isActive ? '' : ' dim'))
      .attr('id', 'p-' + pref.id)
      .attr('opacity', isActive ? 1 : 0.55)
      .on('click', () => { if (isActive) onClick(pref.id); })
      .on('touchstart', function(event) {
        event.preventDefault();
        if (isActive) onClick(pref.id);
      }, { passive: false });

    // 県名ラベル
    const c = pathGen.centroid(feat);
    if (!isNaN(c[0]) && isFinite(c[0])) {
      svg.append('text')
        .attr('x', c[0]).attr('y', c[1] + 3)
        .attr('text-anchor', 'middle')
        .attr('font-size', isActive ? '6.5px' : '5.5px')
        .attr('fill', isActive ? 'rgba(0,0,0,0.65)' : 'rgba(0,0,0,0.35)')
        .attr('pointer-events', 'none')
        .text(pref.name);
    }
  });
}

// ===== 色のリセット =====
function resetPrefColors() {
  PREFS.forEach(pref => {
    const el = document.getElementById('p-' + pref.id);
    if (!el) return;
    const isActive = state.active.includes(pref.id);
    el.setAttribute('fill', isActive ? pref.c : '#b8ccd8');
    el.setAttribute('opacity', isActive ? '1' : '0.55');
    el.classList.remove('correct', 'wrong');
  });
}

// ===== 問題を表示 =====
function showQ() {
  resetPrefColors();
  const p = prefById(state.current);
  document.getElementById('q-ruby').textContent  = p.r;
  document.getElementById('q-kanji').textContent = p.name;
  updateProg();
}

function updateProg() {
  const done = state.total - state.queue.length;
  document.getElementById('prog-fill').style.width = (done / state.total * 100) + '%';
}

function updateScore() {
  document.getElementById('sc-ok').textContent = state.ok;
  document.getElementById('sc-ng').textContent = state.ng;
}

// ===== クリック処理 =====
function onClick(id) {
  if (!state.active.includes(id)) return;

  const el = document.getElementById('p-' + id);
  if (!el) return;

  if (id === state.current) {
    // 正解
    state.ok++;
    el.setAttribute('fill', '#4caf50');
    el.classList.add('correct');
    updateScore();
    playBeep(true);
    confetti();
    setTimeout(() => {
      if (state.queue.length === 0) showEnd();
      else nextQ();
    }, 800);
  } else {
    // 不正解
    state.ng++;
    const origColor = prefById(id).c;
    el.setAttribute('fill', '#ef5350');
    el.classList.add('wrong');
    updateScore();
    playBeep(false);
    setTimeout(() => {
      el.setAttribute('fill', origColor);
      el.classList.remove('wrong');
    }, 500);
  }
}

// ===== 次の問題 =====
function nextQ() {
  if (state.queue.length === 0) { showEnd(); return; }
  state.current = state.queue.pop();
  showQ();
}

// ===== 終了 =====
function showEnd() {
  document.getElementById('end-score').textContent =
    `⭕ ${state.ok}かい　❌ ${state.ng}かい`;
  document.getElementById('popup-end').style.display = 'flex';
  confetti(); confetti();
}

function restartGame() {
  document.getElementById('popup-end').style.display = 'none';
  startGame(state.region);
}

// ===== ゲーム開始 =====
async function startGame(region) {
  state.region  = region;
  state.active  = REGION_IDS[region];
  state.queue   = shuffle([...state.active]);
  state.current = state.queue.pop();
  state.ok = 0; state.ng = 0;
  state.total = state.active.length;

  updateScore();

  document.getElementById('screen-select').style.display  = 'none';
  document.getElementById('screen-game').style.display    = 'flex';
  document.getElementById('popup-end').style.display      = 'none';

  const ok = await loadAndBuildMap();
  if (ok) showQ();
}

function goHome() {
  document.getElementById('screen-game').style.display  = 'none';
  document.getElementById('screen-select').style.display = 'block';
  document.getElementById('popup-end').style.display    = 'none';
}

// ===== 音 =====
let actx;
function playBeep(ok) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const g = actx.createGain(); g.connect(actx.destination);
    const o = actx.createOscillator(); o.connect(g); o.type = 'sine';
    if (ok) {
      o.frequency.setValueAtTime(523, actx.currentTime);
      o.frequency.setValueAtTime(659, actx.currentTime + 0.12);
      o.frequency.setValueAtTime(784, actx.currentTime + 0.24);
      g.gain.setValueAtTime(0.25, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.5);
      o.start(); o.stop(actx.currentTime + 0.5);
    } else {
      o.frequency.setValueAtTime(294, actx.currentTime);
      o.frequency.setValueAtTime(220, actx.currentTime + 0.18);
      g.gain.setValueAtTime(0.25, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.35);
      o.start(); o.stop(actx.currentTime + 0.35);
    }
  } catch(e) {}
}

// ===== 紙吹雪 =====
const COLORS = ['#f44336','#e91e63','#9c27b0','#3f51b5','#2196f3','#00bcd4','#4caf50','#ffeb3b','#ff9800'];
function confetti() {
  for (let i = 0; i < 28; i++) {
    const d = document.createElement('div');
    d.className = 'confetti-piece';
    d.style.left = Math.random() * 100 + 'vw';
    d.style.background = COLORS[Math.random() * COLORS.length | 0];
    d.style.animationDuration = (1.2 + Math.random() * 1.2) + 's';
    d.style.animationDelay   = (Math.random() * 0.5) + 's';
    d.style.width  = (6  + Math.random() * 8)  + 'px';
    d.style.height = (8  + Math.random() * 10) + 'px';
    document.body.appendChild(d);
    d.addEventListener('animationend', () => d.remove());
  }
}
