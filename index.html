<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>にほんちずゲーム</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: linear-gradient(160deg, #c8e6ff 0%, #d4f5c8 100%);
  font-family: 'Rounded Mplus 1c', 'Hiragino Maru Gothic Pro', 'BIZ UDPGothic', Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10px 6px;
  user-select: none;
}

.title {
  font-size: 2em;
  font-weight: bold;
  color: #1a4a8a;
  text-shadow: 2px 2px 0 rgba(255,255,255,0.6);
  margin: 8px 0;
  letter-spacing: 2px;
}

/* ===== ちほうえらびがめん ===== */
#screen-select { width: 100%; max-width: 660px; text-align: center; }

.select-lead {
  font-size: 1.25em;
  color: #444;
  margin-bottom: 16px;
  font-weight: bold;
}

.region-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
  padding: 0 8px;
}

.rbtn {
  padding: 14px 18px;
  font-size: 1.1em;
  font-weight: bold;
  border: none;
  border-radius: 18px;
  cursor: pointer;
  color: white;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.35);
  box-shadow: 0 4px 0 rgba(0,0,0,0.2);
  transition: transform .1s, box-shadow .1s;
  min-width: 150px;
  line-height: 1.4;
}
.rbtn:hover  { transform: translateY(-2px); box-shadow: 0 6px 0 rgba(0,0,0,0.2); }
.rbtn:active { transform: translateY(2px);  box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
.rbtn small { display: block; font-size: 0.72em; opacity: 0.85; }

/* ===== ゲームがめん ===== */
#screen-game { width: 100%; max-width: 700px; display: none; flex-direction: column; align-items: center; }

.top-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
  margin-bottom: 8px;
  width: 100%;
}

.question-box {
  background: white;
  border-radius: 20px;
  padding: 10px 26px;
  text-align: center;
  box-shadow: 0 3px 12px rgba(0,0,0,0.15);
  min-width: 190px;
}
.q-lead { font-size: 0.95em; color: #888; }
.q-ruby { font-size: 1.4em; color: #3366bb; letter-spacing: 4px; line-height: 1.1; }
.q-kanji { font-size: 2.4em; font-weight: bold; color: #111; line-height: 1.15; }

.score-box {
  background: white;
  border-radius: 16px;
  padding: 8px 16px;
  font-size: 1.15em;
  box-shadow: 0 3px 10px rgba(0,0,0,0.1);
  white-space: nowrap;
}

.back-btn {
  padding: 10px 18px;
  border-radius: 12px;
  border: none;
  background: #8899aa;
  color: white;
  font-size: 0.95em;
  cursor: pointer;
  box-shadow: 0 3px 0 rgba(0,0,0,0.2);
}
.back-btn:active { transform: translateY(2px); box-shadow: none; }

.map-wrap {
  width: 100%;
  position: relative;
  touch-action: none;
}

svg#jmap {
  width: 100%;
  height: auto;
  display: block;
  filter: drop-shadow(0 2px 8px rgba(0,0,0,0.12));
}

.pref {
  stroke: white;
  stroke-width: 1.2;
  cursor: pointer;
  transition: opacity .15s;
}
.pref:hover  { opacity: .82; }
.pref.dim    { fill: #d0dde8 !important; cursor: default; }

@keyframes flash-ok {
  0%   { fill: #4caf50; }
  40%  { fill: #a5d6a7; }
  100% { fill: #4caf50; }
}
@keyframes shake {
  0%,100% { transform: translateX(0); }
  20%     { transform: translateX(-6px); }
  60%     { transform: translateX(6px); }
}
.pref.correct { animation: flash-ok .55s ease-out; fill: #4caf50 !important; }
.pref.wrong   { animation: shake .4s ease-out; fill: #ef5350 !important; }

/* 正解ポップアップ */
#popup {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,.38);
  z-index: 200;
  display: none;
}
.popup-box {
  background: white;
  border-radius: 24px;
  padding: 32px 44px;
  text-align: center;
  box-shadow: 0 8px 32px rgba(0,0,0,.25);
  animation: pop-in .25s cubic-bezier(.22,1,.36,1);
}
@keyframes pop-in {
  from { transform: scale(.6); opacity: 0; }
  to   { transform: scale(1);  opacity: 1; }
}
.popup-emoji  { font-size: 3.5em; line-height: 1; }
.popup-title  { font-size: 2em; font-weight: bold; margin: 8px 0 4px; }
.popup-sub    { font-size: 1.1em; color: #555; margin-bottom: 18px; }
.popup-next {
  display: inline-block;
  padding: 14px 36px;
  background: #ff6b35;
  color: white;
  border: none;
  border-radius: 16px;
  font-size: 1.3em;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px 0 rgba(0,0,0,.2);
}
.popup-next:active { transform: translateY(2px); box-shadow: none; }

/* 終了ポップアップ */
#popup-end {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,.45);
  z-index: 300;
  display: none;
}
.end-box {
  background: white;
  border-radius: 24px;
  padding: 36px 48px;
  text-align: center;
  box-shadow: 0 8px 32px rgba(0,0,0,.3);
}
.end-title { font-size: 2.2em; font-weight: bold; color: #1a4a8a; }
.end-score { font-size: 1.5em; margin: 14px 0 22px; }
.end-btns { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.end-btn {
  padding: 12px 28px;
  border: none;
  border-radius: 14px;
  font-size: 1.1em;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 3px 0 rgba(0,0,0,.2);
}
.end-btn:active { transform: translateY(2px); box-shadow: none; }

/* 紙吹雪 */
.confetti-piece {
  position: fixed;
  width: 10px; height: 14px;
  border-radius: 2px;
  top: -20px;
  animation: confetti-fall linear forwards;
  z-index: 400;
  pointer-events: none;
}
@keyframes confetti-fall {
  to { top: 110vh; transform: rotate(720deg) translateX(60px); opacity: 0; }
}

/* 進捗バー */
.progress-bar-wrap {
  width: 100%;
  height: 10px;
  background: rgba(255,255,255,.5);
  border-radius: 8px;
  margin-bottom: 6px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #42a5f5, #66bb6a);
  border-radius: 8px;
  transition: width .4s;
}
</style>

    <button class="rbtn" style="background:#c0392b;" onclick="startGame('kyushu')">

<!-- ===== ゲームがめん ===== -->
<div id="screen-game">

    <button class="back-btn" onclick="goHome()">もどる</button>
  </div>

  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="prog-fill" style="width:0%"></div></div>

  <div class="map-wrap">
    <svg id="jmap" viewBox="0 0 720 860" xmlns="http://www.w3.org/2000/svg">
      <!-- paths injected by JS -->
    </svg>
  </div>

</div>

<!-- 正解ポップアップ -->
<div id="popup">
  <div class="popup-box">
    <div class="popup-emoji" id="pu-emoji">⭕</div>
    <div class="popup-title" id="pu-title">せいかい！</div>
    <div class="popup-sub" id="pu-sub"></div>
    <button class="popup-next" id="pu-btn" onclick="nextQ()">つぎへ！</button>
  </div>
</div>

<!-- 終了ポップアップ -->
<div id="popup-end">
  <div class="end-box">
    <div class="popup-emoji">🎊</div>
    <div class="end-title">ぜんぶ クリア！</div>
    <div class="end-score" id="end-score"></div>
    <div class="end-btns">
      <button class="end-btn" style="background:#3498db;color:white;" onclick="restartGame()">もういちど</button>
      <button class="end-btn" style="background:#aaa;color:white;" onclick="goHome()">もどる</button>
    </div>
  </div>
</div>

  chugoku:  PREFS.filter(p=>p.region==='chugoku').map(p=>p.id),
  shikoku:  PREFS.filter(p=>p.region==='shikoku').map(p=>p.id),
  kyushu:   PREFS.filter(p=>p.region==='kyushu').map(p=>p.id),
};

// ===== ゲーム状態 =====
let state = { region:null, active:[], queue:[], current:null, ok:0, ng:0, total:0, answered:false };

function shuffle(a) {
  const b=[...a];
  for(let i=b.length-1;i>0;i--){const j=Math.random()*i|0;[b[i],b[j]]=[b[j],b[i]];}
  return b;
}

function pref(id){ return PREFS.find(p=>p.id===id); }

// ===== 地図を描く =====
function buildMap() {
  const svg = document.getElementById('jmap');
  svg.innerHTML = '';

  // 海（背景）
  const sea = document.createElementNS('http://www.w3.org/2000/svg','rect');
  sea.setAttribute('width','720'); sea.setAttribute('height','860');
  sea.setAttribute('fill','#a8d8ea'); sea.setAttribute('rx','12');
  svg.appendChild(sea);

  // 沖縄枠ラベル
  const olab = mkText(85, 784, '（おきなわ）', 8, '#fff');
  svg.appendChild(olab);

  // 全prefecture描画
  PREFS.forEach(p=>{
    const el = document.createElementNS('http://www.w3.org/2000/svg','path');
    el.setAttribute('d', p.d);
    el.setAttribute('fill', p.c);
    el.setAttribute('class', 'pref');
    el.setAttribute('id', 'p-'+p.id);
    el.setAttribute('data-id', p.id);
    el.addEventListener('click', ()=>onClick(p.id));
    el.addEventListener('touchstart', e=>{ e.preventDefault(); onClick(p.id); }, {passive:false});
    svg.appendChild(el);

    // 県名ラベル（小さく）
    const c = centroid(p.d);
    if(c){
      const t = mkText(c.x, c.y+3, p.name, 7, 'rgba(0,0,0,0.55)');
      t.setAttribute('pointer-events','none');
      svg.appendChild(t);
    }
  });
}

function mkText(x,y,txt,size,fill){
  const t=document.createElementNS('http://www.w3.org/2000/svg','text');
  t.setAttribute('x',x); t.setAttribute('y',y);
  t.setAttribute('font-size',size); t.setAttribute('fill',fill);
  t.setAttribute('text-anchor','middle'); t.textContent=txt;
  return t;
}

function centroid(d){
  const pts=[];
  const re=/[ML]\s*([\d.]+)[,\s]+([\d.]+)/g; let m;
  while((m=re.exec(d))!==null) pts.push([+m[1],+m[2]]);
  if(!pts.length)return null;
  return {x:pts.reduce((s,p)=>s+p[0],0)/pts.length,
          y:pts.reduce((s,p)=>s+p[1],0)/pts.length};
}

// ===== 色リセット =====
function resetColors(){
  state.active.forEach(id=>{
    const el=document.getElementById('p-'+id);
    if(!el)return;
    el.setAttribute('fill', pref(id).c);
    el.classList.remove('correct','wrong','dim');
  });
}

// ===== 問題を出す =====
function showQ(){
  state.answered=false;
  resetColors();

  // 非アクティブをグレーに
  PREFS.forEach(p=>{
    if(!state.active.includes(p.id)){
      const el=document.getElementById('p-'+p.id);
      if(el){ el.setAttribute('fill','#c8d8e8'); el.classList.add('dim'); }
    }
  });

  const p=pref(state.current);
  document.getElementById('q-ruby').textContent = p.r;
  document.getElementById('q-kanji').textContent = p.name;
  updateProg();
}

function updateProg(){
  const done = state.total - state.queue.length;
  document.getElementById('prog-fill').style.width = (done/state.total*100)+'%';
}

// ===== クリック処理 =====
function onClick(id){
  if(state.answered) return;
  if(!state.active.includes(id)) return;

  const el=document.getElementById('p-'+id);

  if(id===state.current){
    state.answered=true; state.ok++;
    el.classList.add('correct');
    el.setAttribute('fill','#4caf50');
    updateScore();
    playBeep(true);
    confetti();
    setTimeout(()=>{ if(state.queue.length===0){ showEnd(); } else { nextQ(); } }, 900);
  } else {
    state.ng++;
    el.classList.add('wrong');
    el.setAttribute('fill','#ef5350');
    updateScore();
    playBeep(false);
    setTimeout(()=>{
      el.classList.remove('wrong');
      el.setAttribute('fill', pref(id).c);
    }, 500);
  }
}

function nextQ(){
  document.getElementById('popup').style.display='none';
  if(state.queue.length===0){ showEnd(); return; }
  state.current=state.queue.pop();
  showQ();
}

// ===== 終了 =====
function showEnd(){
  document.getElementById('end-score').textContent =
    `⭕ ${state.ok}かい　❌ ${state.ng}かい`;
  document.getElementById('popup-end').style.display='flex';
  confetti(); confetti(); confetti();
}

function restartGame(){ startGame(state.region); }

// ===== スコア =====
function updateScore(){
  document.getElementById('sc-ok').textContent=state.ok;
  document.getElementById('sc-ng').textContent=state.ng;
}

// ===== ゲーム開始 =====
function startGame(region){
  state.region=region;
  state.active=REGION_IDS[region];
  state.queue=shuffle([...state.active]);
  state.current=state.queue.pop();
  state.ok=0; state.ng=0;
  state.total=state.active.length;
  updateScore();
  buildMap();
  document.getElementById('screen-select').style.display='none';
  document.getElementById('screen-game').style.display='flex';
  document.getElementById('popup-end').style.display='none';
  showQ();
}

function goHome(){
  document.getElementById('screen-game').style.display='none';
  document.getElementById('screen-select').style.display='block';
  document.getElementById('popup').style.display='none';
  document.getElementById('popup-end').style.display='none';
}

// ===== 音 (Web Audio API) =====
let actx;
function getActx(){ return actx||(actx=new(window.AudioContext||window.webkitAudioContext)()); }
function playBeep(ok){
  try{
    const ctx=getActx();
    const g=ctx.createGain(); g.connect(ctx.destination);
    const o=ctx.createOscillator(); o.connect(g);
    o.type='sine';
    if(ok){
      o.frequency.setValueAtTime(523,ctx.currentTime);
      o.frequency.setValueAtTime(659,ctx.currentTime+0.12);
      o.frequency.setValueAtTime(784,ctx.currentTime+0.24);
      g.gain.setValueAtTime(0.25,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.5);
      o.start(); o.stop(ctx.currentTime+0.5);
    } else {
      o.frequency.setValueAtTime(294,ctx.currentTime);
      o.frequency.setValueAtTime(220,ctx.currentTime+0.18);
      g.gain.setValueAtTime(0.25,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.35);
      o.start(); o.stop(ctx.currentTime+0.35);
    }
  }catch(e){}
}

// ===== 紙吹雪 =====
const COLORS=['#f44336','#e91e63','#9c27b0','#3f51b5','#2196f3','#00bcd4','#4caf50','#ffeb3b','#ff9800'];
function confetti(){
  for(let i=0;i<28;i++){
    const d=document.createElement('div');
    d.className='confetti-piece';
    d.style.left=Math.random()*100+'vw';
    d.style.background=COLORS[Math.random()*COLORS.length|0];
    d.style.animationDuration=(1.2+Math.random()*1.2)+'s';
    d.style.animationDelay=(Math.random()*0.5)+'s';
    d.style.width=(6+Math.random()*8)+'px';
    d.style.height=(8+Math.random()*10)+'px';
    document.body.appendChild(d);
    d.addEventListener('animationend',()=>d.remove());
  }
}
</script>
